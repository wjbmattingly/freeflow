# GPU override for FreeFlow — requires the NVIDIA Container Toolkit on the host
# (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# The app detects the GPU automatically at startup (check the container logs
# for "GPU detected") and uses it for SAM segmentation and YOLO26 training.

services:
  freeflow:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
